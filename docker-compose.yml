# Application stack. Start Camunda first (see camunda/README.md), then: docker compose up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leavedb
      POSTGRES_USER: leave
      POSTGRES_PASSWORD: leave
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    ports: ["8081:8081"]
    depends_on: [postgres]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/leavedb
      DB_USER: leave
      DB_PASSWORD: leave
      CAMUNDA_GRPC: http://host.docker.internal:26500
      CAMUNDA_REST: http://host.docker.internal:8080

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
